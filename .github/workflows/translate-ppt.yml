name: Translate PPT to zh-CN (offline)

on:
  workflow_dispatch:
    inputs:
      source_path:
        description: 'Source PPTX path'
        required: true
        default: '01计算机设计导论.pptx'
      output_path:
        description: 'Output PPTX path'
        required: true
        default: '01计算机设计导论_zh-CN.pptx'
      enable_ocr:
        description: 'Enable OCR for images'
        required: false
        default: 'false'
      force:
        description: 'Force translation (ignore Chinese detection)'
        required: false
        default: 'false'

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preflight - echo inputs and list files
        run: |
          echo "source_path=${{ inputs.source_path }}"
          echo "output_path=${{ inputs.output_path }}"
          echo "enable_ocr=${{ inputs.enable_ocr }}"
          echo "force=${{ inputs.force }}"
          ls -al

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-pptx langdetect pillow pytesseract argostranslate

      - name: Pre-install Argos en→zh model
        run: |
          python - << 'PY'
          import argostranslate.package as p
          import argostranslate.translate as t
          try:
            p.update()
            av = [a for a in p.get_available_packages() if a.from_code=='en' and a.to_code=='zh']
            if av:
              path = av[0].download()
              p.install_from_path(path)
              print('Installed en->zh model')
            else:
              print('No en->zh package available')
          except Exception as e:
            print('Argos preinstall failed:', e)
          PY

      - name: Install Tesseract (if OCR enabled)
        if: ${{ inputs.enable_ocr == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Run translation (offline)
        run: |
          python scripts/translate_ppt.py --source "${{ inputs.source_path }}" --output "${{ inputs.output_path }}" ${{ inputs.enable_ocr == 'true' && '--enable-ocr' || '' }} ${{ inputs.force == 'true' && '--force' || '' }}

      - name: Commit and push output
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add "${{ inputs.output_path }}"
          git commit -m "Add Chinese translation for ${{ inputs.source_path }} -> ${{ inputs.output_path }} (offline Argos, force=${{ inputs.force }}, ocr=${{ inputs.enable_ocr }})" || echo "No changes to commit"
          git push origin "${{ github.ref_name }}" || echo "Nothing to push"
